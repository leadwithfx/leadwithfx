name: CI
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  worker:
    name: Worker tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node --no-warnings worker/test.mjs

  site:
    name: Site checks (links, metadata, alt text)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node scripts/test-insights.mjs
      - name: Insights output is up to date
        run: |
          node scripts/build-insights.mjs
          node scripts/build-csp.mjs
          git diff --exit-code -- insights insights.html sitemap.xml '*.html' || (echo '::error::Run node scripts/build-insights.mjs then node scripts/build-csp.mjs and commit the result' && exit 1)
      - run: node scripts/check-site.mjs

  accessibility:
    name: Accessibility (axe)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --no-audit --no-fund playwright @axe-core/playwright
      - run: npx playwright install --with-deps chromium
      - run: node scripts/a11y.mjs

  lighthouse:
    name: Lighthouse budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: npm install --no-save --no-audit --no-fund @lhci/cli@0.14.x
      - name: Run Lighthouse
        run: |
          npx lhci autorun --config=lighthouserc.json 2>&1 | tee lhci.log
          status=${PIPESTATUS[0]}
          grep -E "✘|expected|failed" lhci.log | head -8 | while read -r l; do echo "::warning title=lighthouse::$l"; done
          exit $status
