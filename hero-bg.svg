<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 560" preserveAspectRatio="xMidYMid slice"><defs><radialGradient id="g" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#C9A227" stop-opacity=".9"/><stop offset="1" stop-color="#C9A227" stop-opacity="0"/></radialGradient></defs>
<style>
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 3.2s ease-out .5s forwards}
.glow{transform-box:fill-box;transform-origin:center;animation:pulse 3.5s ease-in-out 3.4s infinite}
.dot{opacity:0;animation:show .6s ease-out 3.5s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@keyframes pulse{0%,100%{opacity:.55;transform:scale(.9)}50%{opacity:1;transform:scale(1.15)}}
@keyframes show{to{opacity:1}}
@media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}.glow{animation:none}.dot{animation:none;opacity:1}}
</style>
